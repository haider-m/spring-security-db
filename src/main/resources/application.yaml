app:
  security:
    password-encoder: bcrypt # bcrypt | pbkdf2 | scrypt | argon2

spring:

  application:
    name: spring-security-db

  datasource:
    url: jdbc:mysql://localhost:3306/myapp_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: myuser
    password: mypassword

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect